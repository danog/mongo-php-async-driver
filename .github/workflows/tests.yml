name: Tests

# Every run tests this extension against the official test suites at their latest commits: the
# default branch of mongodb/mongo-php-driver (PHPT) and of mongodb/mongo-php-library (PHPUnit) are
# cloned fresh (tools/ci/clone-upstream.sh; the commits are listed in each job's summary). The
# schedule re-runs them daily, so upstream changes show up even without a push here.

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# a newer push supersedes an older one; a scheduled or manual run gets its own group, so it never
# cancels the run of a push (and the reverse)
concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "${{ matrix.os }} / PHP ${{ matrix.php }}${{ matrix.ts == 'zts' && ' ZTS' || '' }} / MongoDB ${{ matrix.mongodb }} ${{ matrix.topology }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: every topology
          - { os: ubuntu-24.04, php: "8.2", mongodb: "8.0", topology: server }
          - { os: ubuntu-24.04, php: "8.3", mongodb: "8.0", topology: server }
          - { os: ubuntu-24.04, php: "8.4", mongodb: "8.0", topology: server }
          - { os: ubuntu-24.04, php: "8.5", mongodb: "8.0", topology: server }
          - { os: ubuntu-24.04, php: "8.6", mongodb: "8.0", topology: server }
          - { os: ubuntu-24.04, php: "8.4", mongodb: "8.0", topology: replica_set }
          - { os: ubuntu-24.04, php: "8.4", mongodb: "8.0", topology: sharded_cluster }
          - { os: ubuntu-24.04, php: "8.4", mongodb: latest, topology: replica_set }
          # macOS
          - { os: macos-15, php: "8.4", mongodb: "8.0", topology: server }
          - { os: macos-15, php: "8.4", mongodb: "8.0", topology: replica_set }
          # Windows
          - { os: windows-2022, php: "8.4", mongodb: "8.0", topology: server }
          # thread-safe (ZTS) PHP: the oldest, a middle and the newest version, every OS
          - { os: ubuntu-24.04, php: "8.2", mongodb: "8.0", topology: server, ts: zts }
          - { os: ubuntu-24.04, php: "8.4", mongodb: "8.0", topology: server, ts: zts }
          - { os: ubuntu-24.04, php: "8.6", mongodb: "8.0", topology: server, ts: zts }
          - { os: macos-15, php: "8.4", mongodb: "8.0", topology: server, ts: zts }
          - { os: windows-2022, php: "8.4", mongodb: "8.0", topology: server, ts: zts }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Clone the official test suites (latest commits)
        run: tools/ci/clone-upstream.sh upstream

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Start MongoDB
        id: mongodb
        # MongoDB's own test tooling, at the commit the latest official library pins (its submodule)
        uses: ./upstream/library/tests/drivers-evergreen-tools
        with:
          version: ${{ matrix.mongodb }}
          topology: ${{ matrix.topology }}

      - uses: shivammathur/setup-php@v2
        env:
          phpts: ${{ matrix.ts || 'nts' }}
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          # this build is loaded explicitly; the official extension must stay off
          extensions: :mongodb
          # as in the official library's CI (its examples tests set assertions at run time)
          ini-values: zend.assertions=1
          coverage: none

      - uses: dtolnay/rust-toolchain@master
        with:
          # Windows: ext-php-rs uses the vectorcall ABI of PHP's ZEND_FASTCALL functions, which
          # only nightly Rust has (a fixed nightly, so that builds are reproducible)
          toolchain: ${{ startsWith(matrix.os, 'windows') && 'nightly-2026-09-02' || 'stable' }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: php-${{ matrix.php }}-${{ matrix.ts || 'nts' }}

      - name: libclang (for the Zend Engine bindings)
        run: |
          case "$RUNNER_OS" in
            # the runner image has clang (and libclang); install it only if it is missing
            Linux)   ls /usr/lib/llvm-*/lib/libclang.so* >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev; } ;;
            macOS)   echo "LIBCLANG_PATH=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV" ;;
            Windows) echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV" ;;
          esac

      - name: Build the extension
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            # php.exe as a Windows path (build.rs and ext-php-rs run it; there is no php-config)
            export PHP=$(cygpath -w "$(command -v php.exe)")
          else
            export PHP=$(command -v php)
          fi
          if command -v php-config >/dev/null; then export PHP_CONFIG=$(command -v php-config); fi
          cargo build --release --locked
          case "$RUNNER_OS" in
            Linux)   ext=$PWD/target/release/libmongodb.so ;;
            macOS)   ext=$PWD/target/release/libmongodb.dylib ;;
            Windows) ext=$(cygpath -ml "$PWD/target/release/mongodb.dll") ;;
          esac
          echo "EXT=$ext" >> "$GITHUB_ENV"
          php -n -d "extension=$ext" -r 'echo "mongodb ", phpversion("mongodb"), PHP_ZTS ? " (ZTS)" : "", "\n";'

      - name: Official driver tests (PHPT)
        env:
          CLUSTER_URI: ${{ steps.mongodb.outputs.cluster-uri }}
        run: tools/ci/run-phpt.sh "$EXT" "$CLUSTER_URI" "$PWD/phpt.xml"

      - name: Official library tests (PHPUnit)
        env:
          CLUSTER_URI: ${{ steps.mongodb.outputs.cluster-uri }}
        run: tools/ci/run-phplib.sh "$EXT" "$CLUSTER_URI" "$PWD/phplib.xml"

      # this driver's own fiber tests (the official suites have none): the driver's sockets as
      # sources of the embedded native Revolt loop (revolt-rs: epoll / kqueue edge-triggered;
      # Windows: WSAPoll)
      - name: Fiber tests (tests/local), embedded native loop
        if: matrix.topology == 'server'
        env:
          CLUSTER_URI: ${{ steps.mongodb.outputs.cluster-uri }}
        run: |
          PHPT_TESTS="$(echo tests/local/fiber-*.phpt)" tools/ci/run-phpt.sh "$EXT" "$CLUSTER_URI" "$PWD/fibers.xml"

      # on one Linux job: the revolt extension (revolt-rs at the commit Cargo.lock pins) loaded
      # with this one, in both orders (one loop either way); and revolt/event-loop's own suite
      # (revolt-rs's copy) against this extension alone
      - name: Revolt modes (revolt extension, revolt/event-loop's suite)
        id: modes
        if: matrix.os == 'ubuntu-24.04' && matrix.php == '8.4' && matrix.topology == 'server' && !matrix.ts
        env:
          CLUSTER_URI: ${{ steps.mongodb.outputs.cluster-uri }}
        run: |
          fibers="$(echo tests/local/fiber-*.phpt)"
          rev=$(sed -n 's|^source = "git+https://github.com/danog/revolt-rs?rev=\([0-9a-f]*\)#.*|\1|p' Cargo.lock | head -1)
          git clone -q https://github.com/danog/revolt-rs "$RUNNER_TEMP/revolt-rs"
          git -C "$RUNNER_TEMP/revolt-rs" checkout -q "$rev"
          (cd "$RUNNER_TEMP/revolt-rs" && PHP=$(command -v php) PHP_CONFIG=$(command -v php-config) cargo build --locked --profile fast -p revolt-ext)
          rext=$RUNNER_TEMP/revolt-rs/target/fast/librevolt.so
          PHPT_TESTS=$fibers PHPT_EXTRA="-d extension=$rext" tools/ci/run-phpt.sh "$EXT" "$CLUSTER_URI" "$PWD/fibers-revolt-after.xml"
          PHPT_TESTS=$fibers PHPT_EXTRA="-d extension=$EXT" tools/ci/run-phpt.sh "$rext" "$CLUSTER_URI" "$PWD/fibers-revolt-before.xml"
          (cd "$RUNNER_TEMP/revolt-rs/tests" && composer install --no-interaction --no-progress -q)
          (cd "$RUNNER_TEMP/revolt-rs" && EXT=$EXT PHP=php REVOLT_TEST_SCAN_DIR=1 tools/test.sh --log-junit "$GITHUB_WORKSPACE/revolt-suite.xml") || true

      - name: Results
        if: always()
        env:
          PHP_VERSION_MINOR: ${{ matrix.php }}
        run: |
          suites=("Driver (PHPT)" phpt.xml "Library (PHPUnit)" phplib.xml)
          [ "${{ matrix.topology }}" = server ] && suites+=("Fibers (tests/local)" fibers.xml)
          if [ "${{ steps.modes.outcome }}" != skipped ]; then
            suites+=("Fibers, revolt extension loaded after" fibers-revolt-after.xml
              "Fibers, revolt extension loaded before" fibers-revolt-before.xml
              "revolt/event-loop's suite against this extension" revolt-suite.xml)
          fi
          python3 tools/ci/junit-summary.py "${suites[@]}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.os }}-php${{ matrix.php }}-${{ matrix.ts || 'nts' }}-${{ matrix.mongodb }}-${{ matrix.topology }}
          path: |
            phpt.xml
            phplib.xml
            fibers*.xml
            revolt-suite.xml
          if-no-files-found: ignore

  cargo-test:
    name: "cargo test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # the crates without the PHP bindings: pure Rust, no server needed for the unit tests
      - run: cargo test --locked -p mongo-crypt
      - run: cargo test --locked -p mongo-crypt --no-default-features
      - run: cargo test --locked -p mongo-core --lib

  # the official driver's FrankenPHP test (PHPC-2797): FrankenPHP reboots its PHP threads in-process
  # (GSHUTDOWN and MINIT again in one process) and the extension must keep working; run against
  # this extension built into the FrankenPHP image (thread-safe PHP 8.5)
  frankenphp:
    name: "FrankenPHP in-process restart (ZTS, ubuntu-24.04)"
    runs-on: ubuntu-24.04
    # as the official driver's frankenphp.yml: a service container the runner waits for (its
    # healthcheck), reached from the FrankenPHP container through the Docker host
    services:
      mongodb:
        image: mongodb/mongodb-atlas-local:8.0
        ports:
          - "27017:27017"
    env:
      MONGODB_URI: mongodb://host.docker.internal:27017/?directConnection=true&serverSelectionTimeoutMS=2000
    steps:
      - uses: actions/checkout@v4
      - name: Build the FrankenPHP image with this extension
        run: docker build --tag mongodb-frankenphp --file tools/ci/frankenphp.Dockerfile .
      - name: Restart test
        env:
          SKIP_BUILD: "1"
        run: bash tests/phpt/frankenphp/restart-test.sh
      - name: Containers and connectivity (on failure)
        if: failure()
        run: |
          docker ps -a
          docker run --rm --add-host host.docker.internal:host-gateway busybox:1.36 \
            sh -c 'nc -z -w 3 host.docker.internal 27017 && echo "27017 reachable from a container" || echo "27017 NOT reachable from a container"'

  pie:
    name: "PIE build from source (ubuntu-24.04 / PHP ${{ matrix.php }} ${{ matrix.ts }})"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5", "8.6"]
        ts: [nts]
        include:
          - { php: "8.4", ts: zts }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        env:
          phpts: ${{ matrix.ts }}
        with:
          php-version: ${{ matrix.php }}
          tools: pie
          extensions: :mongodb
          coverage: none
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: php-${{ matrix.php }}-${{ matrix.ts }}
      # the runner image has clang (and libclang); install it only if it is missing
      - run: ls /usr/lib/llvm-*/lib/libclang.so* >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev; }
      # the phpize/configure/make path PIE takes when no pre-built binary matches
      - name: pie build
        run: |
          pie repository:add path "$PWD"
          pie build 'danog/mongo-php-async-driver:*@dev' | tee pie.log
          so=$(sed -n 's/^Build complete: //p' pie.log | tail -1)
          test -f "$so"
          php -n -d "extension=$so" -r 'echo "mongodb ", phpversion("mongodb"), "\n";'
