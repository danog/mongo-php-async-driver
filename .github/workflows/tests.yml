name: Tests

# Every run tests this extension against the official test suites at their latest commits: the
# default branch of mongodb/mongo-php-driver (PHPT) and of mongodb/mongo-php-library (PHPUnit) are
# cloned fresh (tools/ci/clone-upstream.sh; the commits are listed in each job's summary).
# autoupdate.yml runs it daily with the newest MongoDB release (input "mongodb"), so that upstream
# changes show up even without a push here.

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      mongodb:
        description: >-
          The MongoDB version every job starts instead of its own (Atlas Local: its "latest" image;
          the 4.2 Docker job keeps 4.2)
        type: string
        default: ""

permissions:
  contents: read

# a newer push supersedes an older one; a scheduled or manual run gets its own group, so it never
# cancels the run of a push (and the reverse)
# (github.workflow: the caller's name when autoupdate.yml calls it, so the two never share a group)
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "${{ matrix.os }} / PHP ${{ matrix.php }}${{ matrix.ts == 'zts' && ' ZTS' || '' }} / MongoDB ${{ (!inputs.mongodb || matrix.setup == 'docker') && matrix.mongodb || matrix.setup == 'atlas-local' && 'latest' || inputs.mongodb }} ${{ matrix.topology }}${{ matrix.setup && format(' ({0})', matrix.setup) || '' }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      # the job's MongoDB version: its own, or the one autoupdate.yml asks for
      MONGODB_VERSION: ${{ (!inputs.mongodb || matrix.setup == 'docker') && matrix.mongodb || matrix.setup == 'atlas-local' && 'latest' || inputs.mongodb }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: every topology
          - { os: ubuntu-24.04, php: "8.2", mongodb: "8.0", topology: server }
          # started through mongo-orchestration instead of mongodb-runner: its server (localhost:8889)
          # stays up, and the upstream tests that start their own mongod through it run
          - { os: ubuntu-24.04, php: "8.3", mongodb: "8.0", topology: server, setup: orchestration }
          - { os: ubuntu-24.04, php: "8.4", mongodb: "8.0", topology: server }
          - { os: ubuntu-24.04, php: "8.5", mongodb: "8.0", topology: server }
          - { os: ubuntu-24.04, php: "8.6", mongodb: "8.0", topology: server }
          - { os: ubuntu-24.04, php: "8.4", mongodb: "8.0", topology: replica_set }
          - { os: ubuntu-24.04, php: "8.4", mongodb: "8.0", topology: sharded_cluster }
          - { os: ubuntu-24.04, php: "8.4", mongodb: latest, topology: replica_set }
          # the setups the official Evergreen CI tests and the default ones skip: auth with TLS
          # (SCRAM user bob, the tools' x509gen certificates); a load balancer (HAProxy in front of
          # two mongos with loadBalancerPort); the server started with requireApiVersion (and
          # API_VERSION=1 for the tests); MongoDB Atlas Local (mongot: the Atlas Search tests);
          # the oldest supported server (4.2, Docker: no 4.2 build runs on ubuntu-24.04)
          - { os: ubuntu-24.04, php: "8.4", mongodb: "8.0", topology: server, setup: auth-tls }
          - { os: ubuntu-24.04, php: "8.4", mongodb: "8.0", topology: replica_set, setup: auth-tls }
          - { os: ubuntu-24.04, php: "8.4", mongodb: "8.0", topology: sharded_cluster, setup: load-balanced }
          - { os: ubuntu-24.04, php: "8.4", mongodb: "8.0", topology: server, setup: api-version }
          - { os: ubuntu-24.04, php: "8.4", mongodb: "8.0", topology: replica_set, setup: atlas-local }
          - { os: ubuntu-24.04, php: "8.4", mongodb: "4.2", topology: replica_set, setup: docker }
          # macOS
          - { os: macos-15, php: "8.4", mongodb: "8.0", topology: server }
          - { os: macos-15, php: "8.4", mongodb: "8.0", topology: replica_set }
          # Windows
          - { os: windows-2022, php: "8.4", mongodb: "8.0", topology: server }
          # thread-safe (ZTS) PHP: the oldest, a middle and the newest version, every OS
          - { os: ubuntu-24.04, php: "8.2", mongodb: "8.0", topology: server, ts: zts }
          - { os: ubuntu-24.04, php: "8.4", mongodb: "8.0", topology: server, ts: zts }
          - { os: ubuntu-24.04, php: "8.6", mongodb: "8.0", topology: server, ts: zts }
          - { os: macos-15, php: "8.4", mongodb: "8.0", topology: server, ts: zts }
          - { os: windows-2022, php: "8.4", mongodb: "8.0", topology: server, ts: zts }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Clone the official test suites (latest commits)
        run: tools/ci/clone-upstream.sh upstream

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Load balancer setting
        if: matrix.setup == 'load-balanced'
        # the action has no input for it; the tools read LOAD_BALANCER from the environment
        run: echo "LOAD_BALANCER=true" >> "$GITHUB_ENV"

      - name: Start MongoDB
        id: mongodb
        if: matrix.setup != 'orchestration' && matrix.setup != 'docker'
        # MongoDB's own test tooling, at the commit the latest official library pins (its submodule)
        uses: ./upstream/library/tests/drivers-evergreen-tools
        with:
          version: ${{ env.MONGODB_VERSION }}
          topology: ${{ matrix.topology }}
          auth: ${{ matrix.setup == 'auth-tls' && 'auth' || '' }}
          ssl: ${{ matrix.setup == 'auth-tls' && 'ssl' || '' }}
          require-api-version: ${{ matrix.setup == 'api-version' && 'true' || '' }}
          local-atlas: ${{ matrix.setup == 'atlas-local' && 'true' || '' }}

      - name: Connection string
        if: steps.mongodb.outcome == 'success'
        env:
          URI: ${{ steps.mongodb.outputs.cluster-uri }}
          DRIVERS_TOOLS: ${{ github.workspace }}/upstream/library/tests/drivers-evergreen-tools
        run: |
          case "${{ matrix.setup }}" in
            auth-tls)
              # the options the official driver's and library's Evergreen tasks append with SSL=yes
              # (the tests that verify the certificate pass tlsCAFile themselves); SSL_DIR: the
              # tools' x509gen certificates, which those tests load
              case "$URI" in *\?*) URI="$URI&" ;; */) URI="$URI?" ;; *) URI="$URI/?" ;; esac
              URI="${URI}ssl=true&sslallowinvalidcertificates=true"
              echo "SSL_DIR=$DRIVERS_TOOLS/.evergreen/x509gen" >> "$GITHUB_ENV" ;;
            # the tests' clients declare the server API the server requires
            api-version) echo "API_VERSION=1" >> "$GITHUB_ENV" ;;
          esac
          echo "CLUSTER_URI=$URI" >> "$GITHUB_ENV"

      - name: Start MongoDB (mongo-orchestration)
        if: matrix.setup == 'orchestration'
        # what the action does, without --mongodb-runner (run-orchestration.sh): mongo-orchestration
        # starts the deployment, and its server stays up for the tests that start their own mongod
        # (createTemporaryMongoInstance(): logs to /tmp/MO/phongo)
        env:
          DRIVERS_TOOLS: ${{ github.workspace }}/upstream/library/tests/drivers-evergreen-tools
          TOPOLOGY: ${{ matrix.topology }}
        run: |
          export MONGODB_BINARIES=$DRIVERS_TOOLS/mongodb/bin MONGO_ORCHESTRATION_HOME=$DRIVERS_TOOLS/.evergreen/orchestration
          export PROJECT_ORCHESTRATION_HOME=$GITHUB_WORKSPACE/.evergreen/orchestration
          bash "$DRIVERS_TOOLS/.evergreen/run-orchestration.sh" -v
          echo "$MONGODB_BINARIES" >> "$GITHUB_PATH"
          echo "CLUSTER_URI=$(cat "$DRIVERS_TOOLS/uri.txt")" >> "$GITHUB_ENV"
          mkdir -p /tmp/MO/phongo
          curl -fsS http://localhost:8889/v1/servers >/dev/null

      - name: Start the load balancer (HAProxy)
        if: matrix.setup == 'load-balanced'
        # as the official Evergreen tasks: the tests connect through the single-mongos one
        env:
          DRIVERS_TOOLS: ${{ github.workspace }}/upstream/library/tests/drivers-evergreen-tools
          MONGODB_URI: ${{ steps.mongodb.outputs.cluster-uri }}
        run: |
          command -v haproxy >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq haproxy; }
          bash "$DRIVERS_TOOLS/.evergreen/run-load-balancer.sh" start
          single=$(sed -n 's/^SINGLE_MONGOS_LB_URI: "\(.*\)"$/\1/p' lb-expansion.yml)
          multi=$(sed -n 's/^MULTI_MONGOS_LB_URI: "\(.*\)"$/\1/p' lb-expansion.yml)
          test -n "$single" && test -n "$multi"
          { echo "CLUSTER_URI=$single"; echo "MONGODB_SINGLE_MONGOS_LB_URI=$single"; echo "MONGODB_MULTI_MONGOS_LB_URI=$multi"; } >> "$GITHUB_ENV"

      - uses: shivammathur/setup-php@v2
        env:
          phpts: ${{ matrix.ts || 'nts' }}
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          # this build is loaded explicitly; the official extension must stay off
          extensions: :mongodb
          # as in the official library's CI (its examples tests set assertions at run time)
          ini-values: zend.assertions=1
          coverage: none

      - uses: dtolnay/rust-toolchain@master
        with:
          # Windows: ext-php-rs uses the vectorcall ABI of PHP's ZEND_FASTCALL functions, which
          # only nightly Rust has (a fixed nightly, so that builds are reproducible)
          toolchain: ${{ startsWith(matrix.os, 'windows') && 'nightly-2026-09-02' || 'stable' }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: php-${{ matrix.php }}-${{ matrix.ts || 'nts' }}

      - name: libclang (for the Zend Engine bindings)
        run: |
          case "$RUNNER_OS" in
            # the runner image has clang (and libclang); install it only if it is missing
            Linux)   ls /usr/lib/llvm-*/lib/libclang.so* >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev; } ;;
            macOS)   echo "LIBCLANG_PATH=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV" ;;
            Windows) echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV" ;;
          esac

      - name: Build the extension
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            # php.exe as a Windows path (build.rs and ext-php-rs run it; there is no php-config)
            export PHP=$(cygpath -w "$(command -v php.exe)")
          else
            export PHP=$(command -v php)
          fi
          if command -v php-config >/dev/null; then export PHP_CONFIG=$(command -v php-config); fi
          cargo build --release --locked
          case "$RUNNER_OS" in
            Linux)   ext=$PWD/target/release/libmongodb.so ;;
            macOS)   ext=$PWD/target/release/libmongodb.dylib ;;
            Windows) ext=$(cygpath -ml "$PWD/target/release/mongodb.dll") ;;
          esac
          echo "EXT=$ext" >> "$GITHUB_ENV"
          php -n -d "extension=$ext" -r 'echo "mongodb ", phpversion("mongodb"), PHP_ZTS ? " (ZTS)" : "", "\n";'

      - name: Start MongoDB (Docker)
        if: matrix.setup == 'docker'
        # a replica set of the official image (tools/topo.sh, initiated through this build)
        run: |
          TOPO_DOCKER=1 TOPO_IMAGE=mongo:$MONGODB_VERSION TOPO_PHP="php -n -d extension=$EXT" tools/topo.sh start replset
          echo "CLUSTER_URI=mongodb://127.0.0.1:28011,127.0.0.1:28012,127.0.0.1:28013/?replicaSet=rs0" >> "$GITHUB_ENV"

      - name: Mock KMS servers (client-side encryption)
        if: runner.os == 'Linux'
        # as the official library's Evergreen tasks: the KMIP server and the KMS servers with an
        # expired certificate, a certificate for another host, and one that requires a client
        # certificate (no credentials: the tests that need AWS/Azure/GCP keys stay skipped)
        env:
          DRIVERS_TOOLS: ${{ github.workspace }}/upstream/library/tests/drivers-evergreen-tools
        run: |
          cd "$DRIVERS_TOOLS/.evergreen/csfle"
          . ./activate-kmstlsvenv.sh
          x=$DRIVERS_TOOLS/.evergreen/x509gen
          nohup python -u kms_http_server.py --ca_file "$x/ca.pem" --cert_file "$x/expired.pem" --port 8100 > http-expired.log 2>&1 &
          nohup python -u kms_http_server.py --ca_file "$x/ca.pem" --cert_file "$x/wrong-host.pem" --port 8101 > http-wrong-host.log 2>&1 &
          nohup python -u kms_http_server.py --ca_file "$x/ca.pem" --cert_file "$x/server.pem" --port 8102 --require_client_cert > http-client-cert.log 2>&1 &
          nohup python -u kms_kmip_server.py --port 5698 > kmip.log 2>&1 &
          for port in 8100 8101 8102 5698; do
            for _ in $(seq 1 120); do nc -z 127.0.0.1 $port && break; sleep 0.5; done
            nc -z 127.0.0.1 $port || { echo "port $port not listening"; tail -n 50 ./*.log; exit 1; }
          done
          {
            echo "KMIP_ENDPOINT=localhost:5698"
            echo "KMS_ENDPOINT_EXPIRED=127.0.0.1:8100"
            echo "KMS_ENDPOINT_WRONG_HOST=127.0.0.1:8101"
            echo "KMS_ENDPOINT_REQUIRE_CLIENT_CERT=127.0.0.1:8102"
            echo "KMS_TLS_CA_FILE=$x/ca.pem"
            echo "KMS_TLS_CERTIFICATE_KEY_FILE=$x/client.pem"
          } >> "$GITHUB_ENV"

      - name: Official driver tests (PHPT)
        run: tools/ci/run-phpt.sh "$EXT" "$CLUSTER_URI" "$PWD/phpt.xml"

      - name: Official library tests (PHPUnit)
        run: tools/ci/run-phplib.sh "$EXT" "$CLUSTER_URI" "$PWD/phplib.xml"

      # this driver's own fiber tests (the official suites have none): the driver's sockets as
      # sources of the embedded native Revolt loop (revolt-rs: epoll / kqueue edge-triggered;
      # Windows: WSAPoll)
      - name: Fiber tests (tests/local), embedded native loop
        # the default setups' standalone (they connect without credentials or TLS)
        if: matrix.topology == 'server' && (!matrix.setup || matrix.setup == 'orchestration')
        run: |
          PHPT_TESTS="$(echo tests/local/fiber-*.phpt)" tools/ci/run-phpt.sh "$EXT" "$CLUSTER_URI" "$PWD/fibers.xml"

      # on one Linux job: the revolt extension (revolt-rs at the commit Cargo.lock pins) loaded
      # with this one, in both orders (one loop either way); builds of it with an incompatible
      # embedding ABI loaded first (this extension refuses to start); and revolt/event-loop's own
      # suite (revolt-rs's copy) against this extension alone
      - name: Revolt modes (revolt extension, revolt/event-loop's suite)
        id: modes
        if: matrix.os == 'ubuntu-24.04' && matrix.php == '8.4' && matrix.topology == 'server' && !matrix.ts && !matrix.setup
        run: |
          fibers="$(echo tests/local/fiber-*.phpt)"
          # the locked commit of the revolt-rs dependency (pinned by rev or tag: the hash after "#")
          rev=$(sed -n 's|^source = "git+https://github.com/danog/revolt-rs?[^#]*#\([0-9a-f]*\)"$|\1|p' Cargo.lock | head -1)
          test -n "$rev"
          git clone -q https://github.com/danog/revolt-rs "$RUNNER_TEMP/revolt-rs"
          git -C "$RUNNER_TEMP/revolt-rs" checkout -q "$rev"
          (cd "$RUNNER_TEMP/revolt-rs" && PHP=$(command -v php) PHP_CONFIG=$(command -v php-config) cargo build --locked --profile fast -p revolt-ext)
          for f in major size; do
            (cd "$RUNNER_TEMP/revolt-rs" && CARGO_TARGET_DIR=target/abi-$f PHP=$(command -v php) PHP_CONFIG=$(command -v php-config) cargo build --locked --profile fast -p revolt-ext --features revolt-rs/test-abi-$f-mismatch)
          done
          rext=$RUNNER_TEMP/revolt-rs/target/fast/librevolt.so
          PHPT_TESTS=$fibers PHPT_EXTRA="-d extension=$rext" tools/ci/run-phpt.sh "$EXT" "$CLUSTER_URI" "$PWD/fibers-revolt-after.xml"
          PHPT_TESTS=$fibers PHPT_EXTRA="-d extension=$EXT" tools/ci/run-phpt.sh "$rext" "$CLUSTER_URI" "$PWD/fibers-revolt-before.xml"
          REVOLT_EXT_ABI_MAJOR=$RUNNER_TEMP/revolt-rs/target/abi-major/fast/librevolt.so REVOLT_EXT_ABI_SIZE=$RUNNER_TEMP/revolt-rs/target/abi-size/fast/librevolt.so \
            PHPT_TESTS=tests/local/revolt-abi-mismatch-001.phpt tools/ci/run-phpt.sh "$EXT" "$CLUSTER_URI" "$PWD/revolt-abi.xml"
          (cd "$RUNNER_TEMP/revolt-rs/tests" && composer install --no-interaction --no-progress -q)
          (cd "$RUNNER_TEMP/revolt-rs" && EXT=$EXT PHP=php REVOLT_TEST_SCAN_DIR=1 tools/test.sh --log-junit "$GITHUB_WORKSPACE/revolt-suite.xml") || true

      - name: Results
        if: always()
        env:
          PHP_VERSION_MINOR: ${{ matrix.php }}
          CI_SETUP: ${{ matrix.setup }}
        run: |
          suites=("Driver (PHPT)" phpt.xml "Library (PHPUnit)" phplib.xml)
          if [ "${{ matrix.topology == 'server' && (!matrix.setup || matrix.setup == 'orchestration') }}" = true ]; then
            suites+=("Fibers (tests/local)" fibers.xml)
          fi
          if [ "${{ steps.modes.outcome }}" != skipped ]; then
            suites+=("Fibers, revolt extension loaded after" fibers-revolt-after.xml
              "Fibers, revolt extension loaded before" fibers-revolt-before.xml
              "Incompatible revolt extension loaded before" revolt-abi.xml
              "revolt/event-loop's suite against this extension" revolt-suite.xml)
          fi
          python3 tools/ci/junit-summary.py "${suites[@]}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.os }}-php${{ matrix.php }}-${{ matrix.ts || 'nts' }}-${{ env.MONGODB_VERSION }}-${{ matrix.topology }}${{ matrix.setup && format('-{0}', matrix.setup) || '' }}
          path: |
            phpt.xml
            phplib.xml
            fibers*.xml
            revolt-abi.xml
            revolt-suite.xml
          if-no-files-found: ignore

  cargo-test:
    name: "cargo test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # the crates without the PHP bindings: pure Rust, no server needed for the unit tests
      - run: cargo test --locked -p mongo-crypt
      - run: cargo test --locked -p mongo-crypt --no-default-features
      - run: cargo test --locked -p mongo-core --lib
      # libmongoc 2.5.9's URI diagnostics tests (no server, no submodule)
      - run: cargo test --locked -p mongo-core --test uri_disclosure

  # the official driver's FrankenPHP test (PHPC-2797): FrankenPHP reboots its PHP threads in-process
  # (GSHUTDOWN and MINIT again in one process) and the extension must keep working; run against
  # this extension built into the FrankenPHP image (thread-safe PHP 8.5)
  frankenphp:
    name: "FrankenPHP in-process restart (ZTS, ubuntu-24.04)"
    runs-on: ubuntu-24.04
    # as the official driver's frankenphp.yml: a service container the runner waits for (its
    # healthcheck), reached from the FrankenPHP container through the Docker host
    services:
      mongodb:
        image: mongodb/mongodb-atlas-local:8.0
        ports:
          - "27017:27017"
    env:
      MONGODB_URI: mongodb://host.docker.internal:27017/?directConnection=true&serverSelectionTimeoutMS=2000
    steps:
      - uses: actions/checkout@v4
      - name: Build the FrankenPHP image with this extension
        run: docker build --tag mongodb-frankenphp --file tools/ci/frankenphp.Dockerfile .
      - name: Restart test
        env:
          SKIP_BUILD: "1"
        run: bash tests/phpt/frankenphp/restart-test.sh
      - name: Restart test with module unload
        env:
          SKIP_BUILD: "1"
          KEEP_MODULES: "0"
        run: bash tests/phpt/frankenphp/restart-test.sh
      - name: Containers and connectivity (on failure)
        if: failure()
        run: |
          docker ps -a
          docker run --rm --add-host host.docker.internal:host-gateway busybox:1.36 \
            sh -c 'nc -z -w 3 host.docker.internal 27017 && echo "27017 reachable from a container" || echo "27017 NOT reachable from a container"'

  pie:
    name: "PIE build from source (ubuntu-24.04 / PHP ${{ matrix.php }} ${{ matrix.ts }})"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5", "8.6"]
        ts: [nts]
        include:
          - { php: "8.4", ts: zts }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        env:
          phpts: ${{ matrix.ts }}
        with:
          php-version: ${{ matrix.php }}
          tools: pie
          extensions: :mongodb
          coverage: none
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: php-${{ matrix.php }}-${{ matrix.ts }}
      # the runner image has clang (and libclang); install it only if it is missing
      - run: ls /usr/lib/llvm-*/lib/libclang.so* >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev; }
      # the phpize/configure/make path PIE takes when no pre-built binary matches
      - name: pie build
        run: |
          pie repository:add path "$PWD"
          pie build 'danog/mongo-php-async-driver:*@dev' | tee pie.log
          so=$(sed -n 's/^Build complete: //p' pie.log | tail -1)
          test -f "$so"
          php -n -d "extension=$so" -r 'echo "mongodb ", phpversion("mongodb"), "\n";'
