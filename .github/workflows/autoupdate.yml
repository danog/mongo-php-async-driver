name: Autoupdate

# Daily: the whole Tests workflow against the latest commits of the official test suites (the
# default branches of mongodb/mongo-php-driver and mongodb/mongo-php-library, as every run of it)
# and the newest MongoDB release, release candidates included ("latest-release"). That is the
# "test" job, a plain run of tests.yml.
#
# Only when it fails, the "fix" job gives Claude Code (anthropics/claude-code-action) the failures
# (tools/ci/failures.sh), a built extension and a running replica set of that MongoDB, to update
# the extension (or, for what it is not to fix, expected-failures.txt / clone-upstream.sh), and
# submits its commits as a pull request on the "autoupdate" branch: a new one, or the open one,
# which the next run continues. Nothing is submitted when Claude found nothing to change (e.g. a
# flaky failure); its report is in the job summary.
#
# Claude Code runs on the Claude subscription of the CLAUDE_CODE_OAUTH_TOKEN secret (claude
# setup-token), never on API usage: no API key is used. The pull request is pushed and opened with
# the token of the Claude GitHub app (the action's github_token output), so the Tests workflow runs
# on it (a push with GITHUB_TOKEN would start none).

on:
  schedule:
    - cron: "17 3 * * *"
  # From the Actions tab, or with gh workflow run autoupdate.yml.
  workflow_dispatch:

permissions:
  contents: read

# A run still going when the next one starts is left to finish.
concurrency:
  group: autoupdate
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/tests.yml
    with:
      mongodb: latest-release

  fix:
    needs: test
    if: failure() && needs.test.result == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
      actions: read # the failed jobs and their logs
      id-token: write # the action's exchange for the Claude GitHub app's token
    defaults:
      run:
        shell: bash
    env:
      DRIVERS_TOOLS: ${{ github.workspace }}/upstream/library/tests/drivers-evergreen-tools
      BRANCH: autoupdate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # the push uses the Claude app's token, not this one
          persist-credentials: false

      - name: The open pull request's branch, if any
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            git fetch -q origin "$BRANCH"
            git checkout -q -B "$BRANCH" FETCH_HEAD
            echo "Continuing pull request #$pr"
          else
            git checkout -q -B "$BRANCH"
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "start=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Clone the official test suites (latest commits)
        run: tools/ci/clone-upstream.sh upstream

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Start MongoDB (newest release, replica set)
        id: mongodb
        uses: ./upstream/library/tests/drivers-evergreen-tools
        with:
          version: latest-release
          topology: replica_set

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer
          extensions: :mongodb
          ini-values: zend.assertions=1
          coverage: none

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: php-8.4-nts

      - name: Build the extension
        run: |
          export PHP=$(command -v php) PHP_CONFIG=$(command -v php-config)
          cargo build --release --locked
          echo "EXT=$PWD/target/release/libmongodb.so" >> "$GITHUB_ENV"
          echo "CLUSTER_URI=${{ steps.mongodb.outputs.cluster-uri }}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: ${{ runner.temp }}/results

      - name: What failed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/autoupdate"
          tools/ci/failures.sh "$GITHUB_RUN_ID" "$RUNNER_TEMP/results" > "$RUNNER_TEMP/autoupdate/failures.md"
          wc -l "$RUNNER_TEMP/autoupdate/failures.md"
          git config --global user.name "claude[bot]"
          git config --global user.email "209825114+claude[bot]@users.noreply.github.com"

      - name: Fix with Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # the subscription (claude setup-token), never an API key
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep,WebFetch,TodoWrite"
          prompt: |
            You maintain danog/mongo-php-async-driver (this checkout, branch ${{ env.BRANCH }}): a
            drop-in replacement for the official `mongodb` PHP extension (ext-mongodb), written in
            Rust. Read README.md and DIVERGENCES.md first.

            The scheduled run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            tested it against the latest commits of the official test suites (mongodb/mongo-php-driver's
            PHPT tests, mongodb/mongo-php-library's PHPUnit suite with its spec tests) and the newest
            MongoDB release, and failed. What failed is in ${{ runner.temp }}/autoupdate/failures.md
            (unexpected failures per job; then the end of the log of each failed job).
            ${{ steps.base.outputs.pr && format('The open pull request #{0} of this branch already has earlier fixes: check which failures it already fixes.', steps.base.outputs.pr) || '' }}

            Your task: make those failures pass, the way ext-mongodb behaves (the reference), then
            commit. Usually upstream added or changed tests, or the server changed behaviour.

            Environment:
            - upstream/driver and upstream/library: the official suites at the commits that ran.
            - The extension is built: $EXT (rebuild with `cargo build --release --locked`).
            - A replica set of the newest MongoDB runs: $CLUSTER_URI. Its binaries are in
              $DRIVERS_TOOLS/mongodb/bin; for another topology, start one with
              `MONGO_BIN=$DRIVERS_TOOLS/mongodb/bin TOPO_DOCKER=0 TOPO_DATA=$RUNNER_TEMP/topo TOPO_PHP="php -n -d extension=$EXT" tools/topo.sh start standalone|sharded`
              (see the top of tools/topo.sh for the URIs).
            - Run PHPT tests: `PHPT_TESTS="upstream/driver/tests/<dir>/<test>.phpt ..." tools/ci/run-phpt.sh "$EXT" "$CLUSTER_URI" /tmp/phpt.xml`.
            - Run PHPUnit tests: `PHPUNIT_ARGS="--filter '<pattern>'" tools/ci/run-phplib.sh "$EXT" "$CLUSTER_URI" /tmp/phplib.xml`.
            - Rust unit tests: `cargo test --locked -p mongo-core --lib`.
            - Only Linux runs here: for a macOS- or Windows-only failure, fix it by reading the code.

            Rules:
            - Fix the extension, not the tests. Do not weaken or skip a test to make it pass.
            - When a failure is not the extension's to fix, do not change the extension for it:
              a documented divergence (DIVERGENCES.md) or a failure ext-mongodb has too goes in
              tools/ci/expected-failures.txt, with a comment saying why (scopes: see its header);
              an upstream test bug can be patched in tools/ci/clone-upstream.sh as the patches there
              are. A failure caused by the runner or the network (a flake) needs nothing: say so.
            - Keep the code's conventions; update DIVERGENCES.md, README.md or tests/local when
              what the extension does changes. Do not edit .github/workflows.
            - Before committing, run the tests you fixed and the related ones, and `cargo test`
              for the crates you changed.
            - Commit on the current branch with `git commit` (a subject line in the style of
              `git log`, and a body saying what changed and why). Do not push; do not open a pull
              request: the workflow does that.
            - Finally, write the pull request's description (Markdown: what failed, what you
              changed, and anything you could not fix or verify) to
              ${{ runner.temp }}/autoupdate/pr-body.md. Write it even if you changed nothing.

      - name: Submit the pull request
        if: always() && steps.claude.outputs.github_token != ''
        env:
          GH_TOKEN: ${{ steps.claude.outputs.github_token }}
          START: ${{ steps.base.outputs.start }}
          PR: ${{ steps.base.outputs.pr }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body=$RUNNER_TEMP/autoupdate/pr-body.md
          [ -f "$body" ] && cat "$body" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "Uncommitted changes left by Claude (not submitted):"; git status --short
          fi
          if [ "$(git rev-parse HEAD)" = "$START" ]; then
            echo "No new commits: nothing to submit."
            exit 0
          fi
          git log --oneline "$START..HEAD"
          # the open pull request's branch moves forward; otherwise the branch starts again from master
          if [ -n "$PR" ]; then force=; else force=--force; fi
          git push -q $force "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$BRANCH"
          text="$(cat "$body" 2>/dev/null || echo "Claude Code wrote no description.")

          Made by $RUN_URL, after the scheduled Tests run against the latest official test suites and MongoDB release failed."
          if [ -n "$PR" ]; then
            gh pr comment "$PR" --body "$text"
            echo "Updated pull request #$PR"
          else
            title="Autoupdate: $(git log --reverse --format=%s "$START..HEAD" | head -1)"
            gh pr create --base master --head "$BRANCH" --title "$title" --body "$text"
          fi
