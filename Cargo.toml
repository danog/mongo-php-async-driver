[package]
name = "mongo-php-async-driver"
version = "0.1.2"
edition = "2021"
publish = false
license = "Apache-2.0 AND SSPL-1.0"  # SSPL-1.0 only with the default sspl-text-fold feature
repository = "https://github.com/danog/mongo-php-async-driver"
description = "A pure-Rust, drop-in replacement for the PHP mongodb extension, with fiber-aware async I/O"

[lib]
# the PHP extension: mongodb.so
name = "mongodb"
crate-type = ["cdylib"]

[features]
default = ["sspl-text-fold"]
# see crates/crypt/Cargo.toml: --no-default-features gives an Apache-2.0-only build
sspl-text-fold = ["mongo-crypt/sspl-text-fold"]

[dependencies]
mongo-core = { path = "crates/core" }
mongo-crypt = { path = "crates/crypt", default-features = false }
# module plumbing and the Zend Engine bindings; only its wrapper.c is compiled (no C libraries)
ext-php-rs = { version = "=0.16.4", default-features = false, features = ["runtime"] }
libc = "0.2"
# the native Revolt event loop (revolt/event-loop 1.0.9 in Rust, MIT): registers the Revolt classes
# at MINIT unless another copy did, and drives the driver's waits without PHP-level calls
revolt-rs = { git = "https://github.com/danog/revolt-rs", tag = "v0.1.0" }

[workspace]
members = ["crates/core", "crates/crypt"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
debug = 1

# ext-php-rs-build accepting PHP 8.6's API number 20261112, as revolt-rs patches it (Cargo applies
# only the root workspace's patches; see revolt-rs's patches/README.md)
[patch.crates-io]
ext-php-rs-build = { git = "https://github.com/danog/revolt-rs", tag = "v0.1.0" }

# quicker builds for test iterations (target/fast/libmongodb.so)
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
