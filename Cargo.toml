[package]
name = "mongo-php-async-driver"
version = "0.2.0"
edition = "2021"
publish = false
license = "Apache-2.0"
repository = "https://github.com/danog/mongo-php-async-driver"

[lib]
crate-type = ["cdylib"]

[dependencies]
ext-php-rs = "0.16.3"
libc = "0.2"
zstd-safe = { version = "8.2", default-features = false }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
debug = 1
