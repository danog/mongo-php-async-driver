[package]
name = "mongo-core"
version = "0.3.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "PHP-independent parts of mongo-php-async-driver: BSON, wire protocol, URI, SDAM, auth"

[dependencies]

[target.'cfg(unix)'.dependencies]
mio = { version = "1", features = ["os-poll", "os-ext"] }

[dev-dependencies]
libc = "0.2"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
