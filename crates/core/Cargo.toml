[package]
name = "mongo-core"
version = "0.3.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "PHP-independent parts of mongo-php-async-driver: BSON, wire protocol, URI, SDAM, auth"

[dependencies]
# SCRAM (pure Rust: RustCrypto hashes/MACs/KDF, the OS RNG through getrandom's syscalls, NFKC for SASLprep)
sha1 = { version = "0.11", default-features = false }
sha2 = { version = "0.11", default-features = false }
md-5 = { version = "0.11", default-features = false }
hmac = { version = "0.13", default-features = false }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
getrandom = "0.3"
unicode-normalization = { version = "0.1", default-features = false }

# TLS: rustls with the graviola crypto provider (Rust and assembly, constant-time RSA; no C, no
# ring, no aws-lc); key files: PKCS#8 (PBES2-encrypted too) and OpenSSL's legacy PEM encryption
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-graviola = "=0.4.0"
graviola = "=0.4.4"
pkcs8 = { version = "0.10", default-features = false, features = ["std", "encryption"] }
aes = { version = "0.8", default-features = false }
des = { version = "0.8", default-features = false }
cbc = { version = "0.1", default-features = false, features = ["alloc", "block-padding"] }
# wire compression (pure Rust: miniz_oxide behind flate2, ruzstd, snap)
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
snap = "1.1"
# OCSP: certificates, requests and responses (pure-Rust DER; every length is bounded by its input)
der = { version = "0.7", default-features = false, features = ["alloc", "oid"] }
x509-cert = { version = "0.2.5", default-features = false, features = ["std"] }
x509-ocsp = { version = "0.2.1", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
mio = { version = "1", features = ["os-poll", "os-ext"] }
# the clocks of PHP's hrtime(true) (already a dependency of mio)
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# the OS API (no C): WSAPoll and sockets, DnsQuery_UTF8, the system certificate store, the
# performance counter of PHP's hrtime(true)
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_NetworkManagement_Dns", "Win32_Security_Cryptography", "Win32_System_Diagnostics_Debug", "Win32_System_Performance"] }

[dev-dependencies]
libc = "0.2"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
