[package]
name = "mongo-crypt"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0 AND SSPL-1.0"  # SSPL-1.0 only with the default sspl-text-fold feature
description = "Client-side field level encryption and Queryable Encryption for mongo-php-async-driver: a pure-Rust port of libmongocrypt"

[features]
default = ["sspl-text-fold"]
# Unicode case and diacritic folding of Queryable Encryption string search: ported from
# libmongocrypt's SSPL-licensed fold code (src/unicode/, see NOTICE). Without it the crate is
# Apache-2.0 only, and string search needs caseSensitive and diacriticSensitive set to true.
sspl-text-fold = []

[dependencies]
mongo-core = { path = "../core" }
# pure-Rust primitives (RustCrypto); the OS RNG through getrandom
aes = { version = "0.8", default-features = false }
cbc = { version = "0.1", default-features = false }
ctr = { version = "0.9", default-features = false }
hmac = { version = "0.13", default-features = false }
sha2 = { version = "0.11", default-features = false }
subtle = { version = "2.6", default-features = false }
getrandom = "0.3"
# RSA (PKCS#1 v1.5 signatures for the GCP OAuth JWT): Rust and assembly, constant-time
graviola = "=0.4.4"

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
